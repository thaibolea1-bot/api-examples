name: CI Tests

on:
  push:
    branches:
      - main
  # Trigger on PRs (no forks)
  pull_request:
    branches:
      - main
  # Manual trigger
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or Ref to test'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || '' }}
          # Persist credentials is false to prevent the PR code from using the GITHUB_TOKEN
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.22'
      - name: Start Flex Tier Proxy
        run: |
          python3 .github/scripts/proxy.py 8080 &
          sleep 1
      - name: Run Go tests
        working-directory: ./go
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:8080
        run: go test -timeout 10m ./...

  test-java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || '' }}
          persist-credentials: false
      - name: Set up JDK 24
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven
      - name: Start Flex Tier Proxy
        run: |
          python3 .github/scripts/proxy.py 8080 &
          sleep 1
      - name: Run Java tests
        working-directory: ./java
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:8080
        run: mvn -B test

  test-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || '' }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: javascript/package-lock.json
      - name: Install dependencies
        working-directory: ./javascript
        run: npm ci
      - name: Start Flex Tier Proxy
        run: |
          python3 .github/scripts/proxy.py 8080 &
          sleep 1
      - name: Run JavaScript tests
        working-directory: ./javascript
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:8080
        run: node --test --test-timeout=600000 *.test.js

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || '' }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./python
        run: pip install absl-py google-genai Pillow pyink pytest
      - name: Start Flex Tier Proxy
        run: |
          python3 .github/scripts/proxy.py 8080 &
          sleep 1
      - name: Run Python tests
        working-directory: ./python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:8080
        # Discover and run all .py files as tests
        run: python -m unittest discover -p "*.py"
